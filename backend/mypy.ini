[mypy]
python_version = 3.12
pretty = true
show_error_codes = true
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = (?x)(
    ^alembic/
    | ^tests/
    | ^scripts/
  )

[mypy-celery.*]
ignore_missing_imports = true

[mypy-jose.*]
ignore_missing_imports = true
