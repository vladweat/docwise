services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-docwise_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docwise} -d ${POSTGRES_DB:-docwise_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docwise}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_in_prod}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 15s

  backend:
    image: docwise-backend:latest
    pull_policy: never
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: none
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docwise}:${POSTGRES_PASSWORD:-change_this_in_prod}@postgres:5432/${POSTGRES_DB:-docwise_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DOCWISE_RLS_SESSION_ROLE: docwise_rls
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-docwise}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_this_in_prod}
      S3_BUCKET: ${S3_BUCKET:-documents}
      EMBEDDING_MODEL_PATH: /app/.models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LD_LIBRARY_PATH: /usr/local/lib
      BILLING_PROVIDER: ${BILLING_PROVIDER:-dev}
      SSO_PROVIDER: ${SSO_PROVIDER:-dev}
      ENABLE_SEARCH_INSPECT: ${ENABLE_SEARCH_INSPECT:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio
      no_proxy: localhost,127.0.0.1,postgres,redis,minio
      EVAL_DIR: /eval
      EVAL_DATASET: /eval/golden_dataset.json
      EVAL_REPORT: /reports/rag_benchmark.md
    volumes:
      - ./backend:/app
      - ./eval:/eval
      - ./reports:/reports
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  db-migrate:
    image: docwise-backend:latest
    pull_policy: never
    command: python -m app.core.migration_cli
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docwise}:${POSTGRES_PASSWORD:-change_this_in_prod}@postgres:5432/${POSTGRES_DB:-docwise_db}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio
      no_proxy: localhost,127.0.0.1,postgres,redis,minio
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  celery-worker:
    image: docwise-backend:latest
    pull_policy: never
    command: python -m celery -A worker.celery_app worker -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docwise}:${POSTGRES_PASSWORD:-change_this_in_prod}@postgres:5432/${POSTGRES_DB:-docwise_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DOCWISE_RLS_SESSION_ROLE: docwise_rls
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-docwise}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_this_in_prod}
      S3_BUCKET: ${S3_BUCKET:-documents}
      EMBEDDING_MODEL_PATH: /app/.models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      LD_LIBRARY_PATH: /usr/local/lib
      BILLING_PROVIDER: ${BILLING_PROVIDER:-dev}
      SSO_PROVIDER: ${SSO_PROVIDER:-dev}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio
      no_proxy: localhost,127.0.0.1,postgres,redis,minio
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A worker.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  celery-beat:
    image: docwise-backend:latest
    pull_policy: never
    command: python -m celery -A worker.celery_app beat -l info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docwise}:${POSTGRES_PASSWORD:-change_this_in_prod}@postgres:5432/${POSTGRES_DB:-docwise_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      DOCWISE_RLS_SESSION_ROLE: docwise_rls
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio
      no_proxy: localhost,127.0.0.1,postgres,redis,minio
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  frontend:
    image: docwise-frontend:latest
    pull_policy: never
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: none
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      API_BASE_URL: http://localhost:8001
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
